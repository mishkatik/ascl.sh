name: Check geofeed

on:
  pull_request:
    paths:
      - 'geofeed.csv'
      - '.github/check-geofeed.py'
      - '.github/workflows/check-geofeed.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'geofeed.csv'
      - '.github/check-geofeed.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate geofeed
        run: python3 .github/check-geofeed.py geofeed.csv
